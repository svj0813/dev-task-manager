<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Task Manager</h1>

        <!-- Auth Section -->
        <div id="auth-container">
            <h2 id="auth-title">Login</h2>
            <form id="auth-form">
                <input type="text" id="auth-username" placeholder="Username" required>
                <input type="password" id="auth-password" placeholder="Password" required>
                <button type="submit" id="auth-submit-btn">Login</button>
            </form>
            <p id="auth-toggle-text">
                Don't have an account? <a href="#" id="auth-toggle-btn">Sign up here</a>
            </p>
        </div>

        <!-- App Section (Hidden until logged in) -->
        <div id="app-container" style="display: none;">
            <div class="user-bar">
                <span>Welcome, <b id="user-display"></b>!</span>
                <button id="logout-btn" class="delete-btn">Logout</button>
            </div>

            <form id="task-form">
                <input type="text" id="task-input" placeholder="Enter a new task..." required>
                <button type="submit">Add Task</button>
            </form>

            <ul id="task-list"></ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
